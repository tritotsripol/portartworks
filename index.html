<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Portfolio Artworks</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:image" content="favicon.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<script src="script.js" defer></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.css" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.umd.js"></script>
</head>
<body>

<section class="header">
  <h1>ผลงานออกแบบ</h1>
  <div class="type">
    <div>Logo</div>
    <div>Icon</div>
    <div>Typography</div>
    <div>Poster</div>
    <div>Infographic</div>
    <div>Mock-up</div>
    <div>Motion</div>
    <div>คลิปสั้น</div>
    <div>สามมิติ</div>
    <div>สไลด์การนำเสนอ</div>
    <div>วาดมือ</div>
  </div><br>
  <p style="font-size: 24px; line-height: 0px;">จัดทำโดย: ไตรทศ ศรีพล</p> 
</section>

<section class="web">

  <section class="tabs-w">
    <section class="tabs" id="tabs">
      <div class="tab">
        <button id="dropdownBtn" class="dropdown-btn">
          <section style="display: grid; grid-template-columns: repeat(2, max-content); gap: 10px;">
            <div>ฟิลเตอร์ค้นหา</div>
            <div><img src="filter-icon.png" width="15" height="15"></div>
          </section>
        </button>
      </div>
      <div style="background: none; box-shadow: none; opacity: 0.5; transition: none; pointer-events: none">|</div> 
      <div class="tab" id="จำนวนผลงาน" style="font-weight: bold;"></div>
      <div class="tab" id="★ ไฮไลท์" style="background: linear-gradient(to right, #e68200, #fca704); font-weight: bold;"></div>
      <div class="tab" id="Photoshop"></div>
      <div class="tab" id="Illustrator"></div>
      <div class="tab" id="After Effects"></div>
      <div class="tab" id="Blender"></div>
      <div class="tab" id="Canva"></div>
      <div class="tab" id="HTML, CSS, Javascript"></div>
    </section>
  </section>
      <div id="filter" class="filter"></div>

  <div class="gallery" id="gallery"></div>
  <div id="no-result" style="display:none;"></div>
</section>

<section class="footer">
    <div style="display:grid; grid-template-columns: repeat(2, max-content); gap: 10px; align-items: center;">
      <div><img src="gmail-icon.png" width="25" height="25"></div>
      <div style="font-size: 24px">tritotsripol@gmail.com</div>
    </div><br>
    <div style="display:grid; grid-template-columns: repeat(2, max-content); gap: 10px; align-items: center;">
      <div><img src="line-icon.png" width="25" height="25"></div>
      <div style="font-size: 24px">tritotsripol</div>
    </div>
</section>


<section class="buttons">
  <div>
    <div style="margin-bottom: 5px;">
      <button class="themebtn" id="theme-toggle">
        <img class="themeicon" id="theme-icon" src="moon-icon.png" alt="Theme Icon" width="30" height="30">
      </button>
    </div>
    <div>
      <button class="themebtn">
        <span id="des">คำอธิบาย</span>
    </div>
  </div>
  <div>
    <div style="margin-bottom: 5px;">
      <button class="gotop">
        <img src="up-icon.png" width="25" height="25" class="uppy">
      </button>
    </div>
    <div>
      <button class="themebtn">
        <span id="kat">หมวดหมู่</span>
    </div>
  </div> 
</section>

</body>
</html>
